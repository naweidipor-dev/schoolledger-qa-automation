name: Quality gate
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm test
  postman-newman:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - name: Start SchoolLedger API
        run: |
          npm start > server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1
      - name: Reset demo data
        run: |
          node --input-type=module -e "const loginResponse = await fetch('http://127.0.0.1:4173/api/auth/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ username: 'qa.admin', password: 'Admin123!' }) }); const { token } = await loginResponse.json(); const resetResponse = await fetch('http://127.0.0.1:4173/api/reset', { method: 'POST', headers: { authorization: 'Bearer ' + token } }); if (!resetResponse.ok) process.exit(1);"
      - name: Run Postman regression with Newman
        run: npm run postman:report
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-html-report
          path: |
            evidence/newman/SchoolLedger-Newman-75-Passed.html
            server.log
          retention-days: 14
  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx playwright install --with-deps chromium firefox
      - name: Run full tagged UI regression
        run: npm run test:ui:regression
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
